<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Monet teaser</title>
  <desc id="desc">Teaser image for Monet paper</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="80" y="250" fill="#ffffff" font-size="54" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Monet</text>
  <text x="80" y="320" fill="#dbeafe" font-size="34" font-family="Segoe UI, Arial, sans-serif">Reasoning in Latent Visual Space</text>
  <text x="80" y="380" fill="#dbeafe" font-size="30" font-family="Segoe UI, Arial, sans-serif">CVPR 2026</text>
</svg>
