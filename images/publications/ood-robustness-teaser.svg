    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="80" y="245" fill="#ffffff" font-size="46" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Improving OOD Robustness by</text>
  <text x="80" y="305" fill="#ffedd5" font-size="40" font-family="Segoe UI, Arial, sans-serif">Adversarial Training with Structured Priors</text>
  <text x="80" y="370" fill="#ffedd5" font-size="30" font-family="Segoe UI, Arial, sans-serif">NeurIPS 2022 (Spotlight)</text>
